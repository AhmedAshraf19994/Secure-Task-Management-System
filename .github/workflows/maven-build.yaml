name: Build With Maven

on:
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: check out git repo
        uses: actions/checkout@v4

      - name: set up jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build And Test With Maven
        run: mvn -B clean verify