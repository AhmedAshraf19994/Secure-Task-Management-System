<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Assigned</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            color: #333333;
        }

        .email-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .email-header {
            background-color: #2563eb;
            color: white;
            padding: 24px;
            text-align: center;
        }

        .email-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .email-body {
            padding: 32px 24px;
            line-height: 1.7;
        }

        .email-body h2 {
            margin-top: 0;
            color: #111827;
            font-size: 22px;
        }

        .task-box {
            margin: 24px 0;
            padding: 18px;
            background-color: #f9fafb;
            border-left: 4px solid #2563eb;
            border-radius: 6px;
        }

        .task-label {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .task-title {
            font-size: 18px;
            font-weight: bold;
            color: #111827;
        }

        .actor-name {
            font-weight: bold;
            color: #2563eb;
        }

        .email-footer {
            padding: 20px 24px;
            background-color: #f9fafb;
            text-align: center;
            font-size: 13px;
            color: #6b7280;
        }

        .button-container {
            margin-top: 32px;
            text-align: center;
        }

        .view-task-btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2563eb;
            color: white !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .view-task-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="email-container">

    <div class="email-header">
        <h1>Task Management System</h1>
    </div>

    <div class="email-body">

        <h2>
            Hello
            <span th:text="${assigneeName}">Ahmed</span>,
        </h2>

        <p>
            You have been assigned a new task by
            <span class="actor-name"
                  th:text="${actorName}">
                Manager
            </span>.
        </p>

        <div class="task-box">

            <div class="task-label">
                TASK TITLE
            </div>

            <div class="task-title"
                 th:text="${taskTitle}">
                Implement Notification Service
            </div>

        </div>

        <p>
            Please review the task details and begin working on it when possible.
        </p>

        <div class="button-container">
            <a href="#"
               class="view-task-btn">
                View Task
            </a>
        </div>

    </div>

    <div class="email-footer">
        © 2026 Task Management System. All rights reserved.
    </div>

</div>

</body>
</html>
